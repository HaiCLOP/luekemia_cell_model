<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Progress</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232b3a78'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jobs.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>What the computer is working on</h1>
      <p class="sub" id="state">Checking…</p>
    </header>

    <p class="empty" id="empty" hidden>Nothing is running right now. When a long job starts, it shows up here by itself. This page refreshes every few seconds.</p>
    <div id="jobs"></div>

    <footer class="foot">Updates every 2 seconds · <a href="/">training console</a></footer>
  </main>

  <template id="job-tpl">
    <article class="job">
      <div class="top">
        <h2 class="title"></h2>
        <span class="badge"></span>
      </div>
      <p class="explain"></p>

      <div class="big">
        <span class="pct"></span>
        <span class="time"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
      <p class="now"></p>

      <ol class="steps"></ol>

      <details class="more">
        <summary>Technical details</summary>
        <dl class="tech"></dl>
      </details>
    </article>
  </template>

  <script src="jobs.js"></script>
</body>
</html>
