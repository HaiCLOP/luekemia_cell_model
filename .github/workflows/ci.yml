name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU only)
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt pytest==9.2.0 ruff
          pip install -r api/requirements.txt
      - name: Lint
        run: ruff check src api tests scripts --select E9,F63,F7,F82,F401 --ignore F401
      - name: Tests
        # API tests use a fake ONNX session, so they run here. Dataset- and real-weight tests skip.
        run: pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Type check and banned-pattern check
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
